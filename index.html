<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>テイスティング練習</title>
  <meta name="theme-color" content="#5c1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="テイスティング">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button id="btn-home" class="header-btn" aria-label="ホームへ">◀</button>
    <h1 id="header-title">テイスティング練習</h1>
    <button id="btn-info" class="header-btn" aria-label="この画面の使い方">ⓘ</button>
  </header>

  <main id="screen"></main>

  <div id="help-modal" class="help-modal hidden">
    <div class="help-backdrop" id="help-backdrop"></div>
    <div class="help-panel">
      <div class="help-head">
        <h2 id="help-title"></h2>
        <button id="help-close" class="header-btn" aria-label="閉じる">✕</button>
      </div>
      <div id="help-body" class="help-body"></div>
    </div>
  </div>

  <footer id="footer-bar" class="footer-bar hidden">
    <div id="footer-progress" class="footer-progress"></div>
    <button id="btn-grade" class="btn-primary">採点する</button>
  </footer>

  <script src="data.js"></script>
  <script src="past-answers.js"></script>
  <script src="teppan.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
